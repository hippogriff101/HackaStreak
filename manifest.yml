display_information:
  name: HackaStreak
  description: Check Hackatime streaks from Slack
features:
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: false
  bot_user:
    display_name: HackaStreak
    always_online: true
  slash_commands:
    - command: /hackastreak
      description: Check a Hackatime streak
      usage_hint: "[username] | set [username]"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - chat:write
      - commands
      - reactions:write
settings:
  event_subscriptions:
    bot_events:
      - app_home_opened
      - app_mention
      - message.channels
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
